[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "0.1.0"
description = "Ultron CLI toolbox: hashscan, fetch, recon, diffscan, logtail"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-whois>=0.9",
]

[project.scripts]
ultron = "ultron.cli:main"

[tool.setuptools.packages.find]
include = ["ultron*"]